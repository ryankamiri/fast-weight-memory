[project]
name = "fast-weight-memory"
version = "0.1.0"
description = "Experiments with fast-weight memory and test-time context distillation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "beartype>=0.22.9",
    "datasets>=5.0.1",
    "jaxtyping>=0.3.7",
    "pyyaml>=6.0.2",
    "torch==2.9.1",
    "transformers==4.57.6",
    "wandb>=0.21",
]

[dependency-groups]
dev = [
    "ipykernel>=7,<8",
    "jupyterlab>=4,<5",
    "mosaicml-streaming>=0.13.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
