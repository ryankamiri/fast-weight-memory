model:
  architecture: taal
  model_id: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  working_memory_size: 32
  max_persistent_kv_tokens: 0
  memory_dim: 128
  memory_depth: 2
  memory_conv_kernel_size: 4
  memory_chunk_size: 1
  memory_initial_forget: 0.01
  memory_initial_momentum: 0.9
  memory_initial_write_strength: 0.1
  memory_pre_rmsnorm: false
  memory_mlp_output_layernorm: false
  memory_normalization_eps: 1.0e-06
  num_persistent_tokens: 8
  persistent_init_std: 0.02
  memory_max_write_grad_norm: 1.0
data:
  dataset_id: data/taal_cpt/D.jsonl
  record_format: causal_lm
  variable_length: true
  preserve_order: true
  train:
    split: train
    start: 0
    end: 80
  val:
    split: train
    start: 80
    end: 89
  batch_size: 1
  seq_len: 1024
  num_workers: 0
  shuffle_buffer_size: 1
loss:
  all_tokens_weight: 1.0
optimizer:
  lr: 3.0e-05
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  weight_decay: 0.0
scheduler:
  warmup_steps: 5
  schedule_steps: 80
  final_lr: 3.0e-05
training:
  max_steps: 80
  seed: 42
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  max_grad_norm: 1.0
  eval_every_steps: 40
  eval_at_end: true
  log_every_steps: 1
  trainable_parameters: taal_only
  initial_taal_gate: 0.05
  save_traces: true
validation:
  memory_read_scales:
  - 1.0
  - 0.0
checkpoints:
  output_dir: checkpoints
  save_best: true
  save_final: true
  save_steps:
  - 40
  - 80
  selection_metric: val/loss
  selection_mode: min
wandb:
  project: fast-weight-memory
  entity: ryanamiri05-northeastern-university
  name: taal-cpt-D
