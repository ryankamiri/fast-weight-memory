model:
  architecture: taal
  model_id: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  working_memory_size: 32
  max_persistent_kv_tokens: 0
  memory_dim: 128
  memory_depth: 2
  memory_conv_kernel_size: 4
  memory_chunk_size: 1
  memory_initial_forget: 0.01
  memory_initial_momentum: 0.9
  memory_initial_write_strength: 0.1
  memory_pre_rmsnorm: false
  memory_mlp_output_layernorm: false
  memory_normalization_eps: 1.0e-06
  num_persistent_tokens: 8
  persistent_init_std: 0.02
  memory_read_layernorm: true
data:
  dataset_id: data/taal_capacity_16_gap192.jsonl
  dataset_config: local-jsonl
  record_format: bridge_memory
  train:
    split: train
    start: 0
    end: 16
    conditions:
    - micro_conflict
    query_variants:
    - exact
  val:
    split: train
    start: 0
    end: 16
    conditions:
    - micro_conflict
    query_variants:
    - exact
  allow_train_val_overlap: true
  batch_size: 1
  seq_len: 224
  num_workers: 0
  shuffle_buffer_size: 16
loss:
  all_tokens_weight: 0.0
  delayed_answer_weight: 1.0
optimizer:
  lr: 0.0001
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  weight_decay: 0.0
scheduler:
  warmup_steps: 10
  schedule_steps: 1000
  final_lr: 0.0001
training:
  max_steps: 400
  seed: 42
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  max_grad_norm: 1.0
  eval_every_steps: 100
  eval_at_end: true
  log_every_steps: 1
  trainable_parameters: taal_only
  initial_taal_gate: 0.05
  save_traces: true
validation:
  memory_read_scales:
  - 1.0
  - 0.0
checkpoints:
  output_dir: checkpoints
  save_best: true
  save_final: true
  save_steps:
  - 100
  - 200
  - 300
  - 400
  selection_metric: val/loss
  selection_mode: min
wandb:
  project: fast-weight-memory
  entity: ryanamiri05-northeastern-university
  name: taal-stability-read_ln
