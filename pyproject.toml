[project]
name = "fast-weight-memory"
version = "0.1.0"
description = "Experiments with fast-weight memory and test-time context distillation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch==2.9.1",
    "transformers==4.57.6",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
